[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bpo"
version = "0.1.0"
description = "Behaviour Policy Optimization: provably lower variance return estimates for off-policy reinforcement learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium[mujoco]>=1.1.1",
  "tensorflow-cpu>=2.18.0,<2.19.0",
  "tensorflow-probability==0.25.0",
  "numpy==1.26.4",
  "tensorboard>=2.18.0",
  "tqdm>=4.66.5",
  "jax==0.4.35",
  "optax>=0.1.9",
  "flax>=0.9.0",
  "ml-dtypes>=0.4.1",
  "ruamel.yaml>=0.18.0,<0.20.0",
]

[project.scripts]
bpo = "bpo.run:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bpo", "bpo.*"]

[dependency-groups]
dev = ["pytest>=9.0.3"]
cuda12 = ["jax[cuda12]==0.4.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
